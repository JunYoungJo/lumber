[package]
name = "lumber"
version = "0.1.0"
description = "Lumber — modern log viewer"
authors = ["jyjo"]
edition = "2021"

[lib]
name = "lumber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
regex = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
